name: Windows installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile native Python sources
        shell: pwsh
        run: python -m compileall -q container tests/test_windows_service.py
      - name: Test and build Windows installer
        shell: pwsh
        run: ./scripts/Build-Windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: WinWhisper-Windows-x64
          path: |
            dist/*Setup*.exe
            dist/*.sha256
          if-no-files-found: error
